<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高質感金色導覽控制台</title>
    <style>
                /* --- 全域重設（🏆終極解鎖版：徹底消滅手機版跨頁大空白） --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: #000;
            color: #fff;
            scrollbar-width: none; /* 隱藏滾動條 Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* 隱藏滾動條 Chrome/Safari */
        }

        /* 📱 關鍵核心：當寬度小於 768px（手機直向）時，強制解除 html 與 body 的滿版鎖定 */
        @media (max-width: 768px) {
            html, body {
                height: auto !important;
                overflow-x: hidden !important;
            }
        }


        /* --- 右側金色圈圈導覽列 --- */
        .dot-navigation {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: flex-end;
        }
        .dot-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            position: relative;
        }
        .dot-label {
            color: #d4af37;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.4s ease;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }
        .dot-circle {
            width: 12px;
            height: 12px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: transparent;
            transition: all 0.4s ease;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }
        .dot-item.active .dot-circle,
        .dot-item:hover .dot-circle {
            background: #d4af37;
            transform: scale(1.3);
            box-shadow: 0 0 15px #d4af37, 0 0 25px rgba(212, 175, 55, 0.6);
        }
        .dot-item.active .dot-label,
        .dot-item:hover .dot-label {
            opacity: 1;
            transform: translateX(0);
        }

               /* --- 網頁段落區塊（✨已修正：手機版高度自動貼齊，消滅空白間隔） --- */
        .page-section {
            width: 100%;
            height: 100vh; /* 電腦版維持完美全螢幕捲動 */
            position: relative;
        }

        /* 📱 專屬手機版 RWD 修正：移除強制的全螢幕高度 */
        @media (max-width: 768px) {
            /* 讓第一頁（最新消息）在手機上的高度等於圖片高度，絕不多留 1 像素的空白 */
            #page1.page-section {
                height: auto !important; 
                min-height: auto !important;
            }
        }


                /* --- 頁一：最新消息圖片輪播（🏆終極滿版鎖定：手機電腦絕對獨佔全螢幕） --- */
        .page1-carousel-section {
            background-color: #000;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100vh; /* 🏆 核心修改：無論電腦或手機，死死霸佔 100% 的全螢幕高度 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000; /* 圖片不夠大時由純黑底色優雅填滿，絕對不露底 */
        }
        .carousel-slide.active {
            opacity: 1;
            z-index: 1;
        }
        
        /* 🏆 核心修改：利用智慧適配鎖定，讓不符螢幕比例的橫幅圖片能完美居中、完整顯現，且絕不破壞全螢幕結構 */
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ✨ 改回 contain，確保您的活動公告圖完整顯示、不被任何角度裁切 */
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin: auto;
        }
        
        /* 底部控制按鈕容器定位 */
        .carousel-caption {
            position: absolute;
            bottom: 40px; /* 電腦版距離底部的質感留白 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .carousel-controls-bottom {
            display: flex;
            gap: 20px;
        }
        .carousel-arrow {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #d4af37;
            font-size: 1.4rem;
            padding: 6px 18px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 4px;
        }
        .carousel-arrow:hover { 
            background: #d4af37; 
            color: #000; 
            box-shadow: 0 0 10px #d4af37;
        }

        /* 📱 專屬手機版 RWD 覆寫：保持獨佔全螢幕，僅微調按鈕防止擋圖 */
        @media (max-width: 768px) {
            .carousel-container {
                height: 100vh !important; /* 🏆 核心修改：強制手機版也必須是 100% 全螢幕高度 */
            }
            .carousel-slide img {
                width: 95%; /* 手機上看時，左右保留 5% 的微距，讓卡片海報更具呼吸感 */
                height: auto;
            }
            .carousel-caption {
                bottom: 30px; /* 手機版按鈕微調，精準落在橫幅圖片的下方空白處 */
            }
            .carousel-arrow {
                font-size: 1.1rem;
                padding: 4px 14px;
            }
        }




        /* --- 頁二：壘包功能區塊樣式（🏆終極幾何修正版：完美菱形與絕對置中） --- */
        .baseball-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 40px;
            position: relative;
        }
        .field-wrapper {
            position: relative;
            width: 75vmin;  
            height: 75vmin;
            max-width: 550px;
            max-height: 550px;
        }
        .diamond-lines {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border: 2px solid rgba(212, 175, 55, 0.8); 
            transform: rotate(45deg);
            z-index: 1;
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .base-card {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: #fff;
        }
        .base-content-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg);
            width: 100%;
            height: 100%;
        }
        .base-content-inner img {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            object-fit: contain;
            display: block;
        }
        .base-content-inner span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
            white-space: nowrap;
            text-align: center;
            display: block;
            width: 100%;
        }
        .base-2nd { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                       
        .base-2nd:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-3rd { top: 50%; left: 0; transform: translateY(-50%) rotate(45deg); }                       
        .base-3rd:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-1st { top: 50%; right: 0; transform: translateY(-50%) rotate(45deg); }                      
        .base-1st:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-home { bottom: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                  
        .base-home:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-card:hover ~ .center-circle {
            box-shadow: 0 0 25px #d4af37;
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body>

    <!-- 右側替代滾動條：金色精緻圈圈導覽選單 -->
    <div class="dot-navigation">
        <div class="dot-item active" data-target="page1">
            <span class="dot-label">📢 最新消息</span>

      <!-- 頁一：全螢幕輪播圖區塊（✨全新升級：改用 img 標籤搭配黑科技適配，根除黑邊與手機空白） -->

            <!-- 📌 第一張最新消息

            </a>

            <!-- 📌 第三張最新消息 -->
            <a href="這裡改成第三張圖要跳轉的網頁.html" target="_self" class="carousel-slide">

        </div>

    <!-- 頁二：響應式壘包功能區塊 -->
    <section id="page2" class="page-section">
        <div class="baseball-container">
            <div class="field-wrapper">
                <div class="diamond-lines"></div>

                <!-- 二壘：Instagram -->
                <a href="https://www.instagram.com/stray.official.baseball/" target="_blank" class="base-card base-2nd">

                <a href="https://www.youtube.com/channel/UCPKMd6qnsWnA0CFn2rYVQtw" target="_blank" class="base-card base-3rd">
                    <div class="base-content-inner">
                        <img src="https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp" alt="YT">
                         <span>YT</span> 
                    </div>
                </a>

                <!-- 一壘：Facebook -->

                    <div class="base-content-inner">

                <!-- 本壘：首頁 -->
                <a href="https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81-home?authuser=0"_self" class="base-card base-home" id="home-base-btn">

    <script>
        /* --- 1. 右側圈圈點擊：平滑滾動到該頁面 --- */
        const dotItems = document.querySelectorAll('.dot-item');
        dotItems.forEach(item => {
            item.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const targetSection = document.getElementById(targetId);
                targetSection.scrollIntoView({ behavior: 'smooth' });
            });
        });

        /* --- 本壘按鈕：自動平滑滾動回第一頁 --- */
        document.getElementById('home-base-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('page1').scrollIntoView({ behavior: 'smooth' });
        });

        /* --- 2. 智慧滾輪監聽：滾動時自動高亮對應的金色圈圈 --- */
        const sections = document.querySelectorAll('.page-section');
        window.addEventListener('scroll', () => {
            let currentActiveSectionId = "";
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.pageYOffset >= sectionTop - window.innerHeight / 2) {
                    currentActiveSectionId = section.getAttribute('id');
                }
            });
            dotItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-target') === currentActiveSectionId) {
                    item.classList.add('active');
                }
            });
        });

        /* --- 3. 全螢幕最新消息自動輪播邏輯 --- */
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }
        setInterval(() => { changeSlide(1); }, 5000);
    </script>
    </script> <!-- 這是原有的全域腳本結尾，防錯閉合 -->

    <!-- ==========================================
       style 區塊：第 3 頁戰績圖 3D 視覺樣式
       ========================================== -->
    <style>
        /* 第 3 頁主容器 */
        #page3.page-section {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 40px;
            overflow: hidden;
        }

        /* 3D 視差舞台：啟動深度透視感 */
        .parallax-stage {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* 🏆 3D 卡片主體 */
        .standings-card {
            position: relative;
            width: 80vmin;  
            height: auto;
            max-width: 650px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.1);
            transform-style: preserve-3d; /* 讓內部元素支援 3D 層次 */
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        /* 懸停時外框發光增強 */
        .standings-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.4);
        }

        /* 戰績圖片本體 */
        .standings-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            display: block;
            transform: translateZ(30px); /* 讓圖片在 3D 空間中向前浮出 30px */
            pointer-events: none; /* 防止圖片干擾滑鼠事件 */
        }

        /* 🏆 金色隨鼠流光保護層 */
        .card-shine {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 14px;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.3s ease;
            transform: translateZ(31px); /* 流光鎖在圖片最表層 */
        }
        .standings-card:hover .card-shine {
            opacity: 1;
        }

        /* 📱 手機版 RWD 降級優化：手機上關閉 3D 避免晃動頭暈，改為精緻放大 */
        @media (max-width: 768px) {
            #page3.page-section {
                height: auto !important;
                padding: 40px 20px;
            }
            .standings-card {
                width: 100%;
                transform: none !important; /* 關閉 3D 傾斜 */
                transition: transform 0.3s ease;
            }
            .standings-card:active {
                transform: scale(1.03) !important; /* 手機按住時微幅放大 */
            }
            .standings-card img {
                transform: none !important;
            }
            .card-shine {
                display: none; /* 手機不跑流光 */
            }
        }
    </style>

    <!-- ==========================================
       HTML 區塊：第 3 頁戰績架構與右側第 3 點選單
       ========================================== -->
    <!-- 頁三：球隊戰績 3D 視差區塊 -->
    <section id="page3" class="page-section">
        <div class="parallax-stage">
            <div class="standings-card" id="parallax-card">
                <!-- 📌 請將 src 裡換成您準備好的戰績圖檔名（如 standings.jpg） -->
                <img src="https://i.ibb.co/60jtpLKv/2026-HB-0830.png" alt="球隊戰績表">
                <!-- 流光層 -->
                <div class="card-shine" id="card-shine-layer"></div>
            </div>
        </div>
    </section>

    <!-- ==========================================
       JavaScript 區塊：第 3 頁專屬 3D 視差與導覽擴充
       ========================================== -->
    <script>
        /* --- A. 動態擴充右側導覽列：在原本的圈圈清單裡補上第三點 --- */
        const navContainer = document.querySelector('.dot-navigation');
        if (navContainer) {
            // 建立第三個戰績點點
            const newDot = document.createElement('div');
            newDot.className = 'dot-item';
            newDot.setAttribute('data-target', 'page3');
            newDot.innerHTML = '<span class="dot-label">📊 球隊戰績</span><div class="dot-circle"></div>';
            navContainer.appendChild(newDot);
        }

        /* --- B. 擴充原有圈圈的點擊與滾輪監聽邏輯 --- */
        const allDotItems = document.querySelectorAll('.dot-item');
        const allSections = document.querySelectorAll('.page-section');

        // 重新為所有點點（包含新老點點）補上點擊流暢滾動
        allDotItems.forEach(item => {
            // 先清除舊監聽防止重複綁定
            item.replaceWith(item.cloneNode(true));
        });
        
        // 重新獲取綁定
        const refreshedDots = document.querySelectorAll('.dot-item');
        refreshedDots.forEach(item => {
            item.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                document.getElementById(targetId).scrollIntoView({ behavior: 'smooth' });
            });
        });

        // 即時滾輪動態追蹤第 3 頁
        window.addEventListener('scroll', () => {
            let activeId = "";
            allSections.forEach(section => {
                if (window.pageYOffset >= section.offsetTop - window.innerHeight / 2) {
                    activeId = section.getAttribute('id');
                }
            });
            refreshedDots.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-target') === activeId) {
                    item.classList.add('active');
                }
            });
        });

        /* --- C. 🏆 核心 3D 視差與金色滑鼠流光演算腳本 --- */
        const card = document.getElementById('parallax-card');
        const shine = document.getElementById('card-shine-layer');

        if (card && shine && window.innerWidth > 768) {
            card.addEventListener('mousemove', (e) => {
                const cardRect = card.getBoundingClientRect();
                
                // 計算滑鼠在卡片內部的相對座標位置 (0 到 寬度/高度)
                const x = e.clientX - cardRect.left;
                const y = e.clientY - cardRect.top;
                
                // 將座標轉化為以中心點為 0 的相對百分比 (-0.5 到 0.5)
                const xc = cardRect.width / 2;
                const yc = cardRect.height / 2;
                const dx = x - xc;
                const dy = y - yc;
                
                // 🏆 計算旋轉角度 (限制在最大傾斜 ±15 度以內，動作精緻不浮誇)
                const tiltX = (dy / yc) * -15;
                const tiltY = (dx / xc) * 15;
                
                // 讓 3D 卡片產生扭轉
                card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                
                // 🏆 金色流光動態跟隨：讓放射漸層的中心點死死跟著滑鼠座標走
                const px = (x / cardRect.width) * 100;
                const py = (y / cardRect.height) * 100;
                shine.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(212, 175, 55, 0.25) 0%, transparent 60%)`;
            });

            // 當滑鼠離開卡片時，平滑地校正回原位並熄滅流光
            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                card.style.transition = `transform 0.5s ease`;
            });

            card.addEventListener('mouseenter', () => {
                card.style.transition = `none`; // 進入時取消延遲，手感才即時
            });
        }
    </script>
</body>
