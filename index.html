<style>  
 
* { box-sizing: border-box; }  
 
body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; font-family: sans-serif; background-color: #11141a; }  
 
 
 
.carousel-container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }  
 
 
 
/* 背景層基礎設定 */  
 
.bg-layer {  
 
position: absolute;  
 
top: 0;  
 
left: 0;  
 
width: 100%;  
 
height: 100%;  
 
z-index: 1;  
 
background-size: cover;  
 
background-position: center;  
 
background-repeat: no-repeat;  
 
opacity: 0;  
 
transition: opacity 1.2s ease-in-out;  
 
will-change: opacity;  
 
}  
 
 
 
/* 🚀 【精確核對】直接寫入您提供的 4 張 ImgBB 大背景圖原始網址 */  
 
.layer-1 { background-image: url('https://i.ibb.co/Jjvqg4CQ/2026.jpg'); } /* 第一張：2026冬盟合照 */  
 
.layer-2 { background-image: url('https://i.ibb.co/ZzXtCG4w/image.png'); } /* 第二張：最新消息背景 */  
 
.layer-3 { background-image: url('https://i.ibb.co/DfST7yL3/2.png'); } /* 第三張：排名封面2 */  
 
.layer-4 { background-image: url('https://i.ibb.co/gMZXzdyJ/STRAY.png'); } /* 第四張：關於我們 (剪影) */  
 
/* 純 CSS 狀態連動控制透明度 */  
.carousel-container.state-1 .layer-1 { opacity: 1; }  
.carousel-container.state-2 .layer-2 { opacity: 1; }  
.carousel-container.state-3 .layer-3 { opacity: 1; }  
.carousel-container.state-4 .layer-4 { opacity: 1; }  
 
/* 黑色半透明保護遮罩 */  
.bg-overlay {  
position: absolute;  
top: 0; left: 0; width: 100%; height: 100%;  
background: rgba(0, 0, 0, 0.5);  
z-index: 2;  
pointer-events: none;  
}  
 
/* 核心 RWD 比例控制盒 */  
.responsive-box {  
position: relative;  
z-index: 3;  
width: 320px;  
height: 320px;  
display: flex;  
justify-content: center;  
align-items: center;  
}  
 
.circle-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }  
 
/* 中央大圖 */  
.center-logo { z-index: 4; pointer-events: none; width: 50%; height: 50%; display: flex; justify-content: center; align-items: center; }  
.main-logo-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }  
 
/* 圓軸外框線 */  
.rotating-circle { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 50%; transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1); }  
 
/* 4 個按鈕圖示尺寸樣式 */  
.icon { position: absolute; width: 50px; height: 50px; background: rgba(17, 20, 26, 0.95); border: 1.5px solid #d4af37; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; text-decoration: none; overflow: hidden; opacity: 0.6; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: background-color 0.5s, border-color 0.5s, opacity 0.5s, box-shadow 0.5s, transform 1.1s; }  
.icon:hover { opacity: 1; border-color: #ffffff; }  
.icon.active { opacity: 1; background-color: #d4af37; border-color: #ffffff; scale: 1; box-shadow: 0 0 15px #d4af37; }  
 
/* 反向旋轉修正容器：抵消轉盤角度，維持小圖示與縮圖正立 */  
.icon-content {  
display: flex;  
justify-content: center;  
align-items: center;  
width: 100%;  
height: 100%;  
transform-origin: center center;  
color: #d4af37;  
font-size: 20px;  
transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;  
}  
.icon.active .icon-content { color: #11141a; }  
 
/* 小圖示內縮圖通用樣式（完美剪裁貼齊正圓） */  
.small-logo-img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.5s; }  
.icon.active .small-logo-img { filter: brightness(0.15); } /* 選中時壓暗融入金底 */  
 
/* 精準平移置中定位 */  
.icon-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }  
.icon-2 { top: 50%; right: 0; transform: translate(50%, -50%); }  
.icon-3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }  
.icon-4 { top: 50%; left: 0; transform: translate(-50%, -50%); }  
 
/* 💻 平板中螢幕縮放斷點 */
@media (max-width: 1024px) {
  .responsive-box { width: 180px; height: 180px; } /* 原 240px -> 縮小到 180px */
  .icon { width: 36px; height: 36px; }             /* 原 44px -> 縮小到 36px */
  .icon-content { font-size: 14px; }               /* 字體同步微調，防止爆字 */
}

/* 📱 手機小螢幕防裁切縮小斷點 */
@media (max-width: 480px) {
  .responsive-box { width: 120px; height: 120px; } /* 原 160px -> 縮小到 120px，完美閃過窄邊界 */
  .icon { width: 28px; height: 28px; }             /* 原 34px -> 縮小到 28px */
  .icon-content { font-size: 10px; }               /* 字體微調，確保小螢幕上依然清晰 */
}

 
/* 轉盤主體旋轉角度 */  
.deg-0 { transform: rotate(0deg); }  
.deg-1 { transform: rotate(-90deg); }  
.deg-2 { transform: rotate(-180deg); }  
.deg-3 { transform: rotate(-270deg); }  
</style>  
 
<script>  
const container = document.getElementById('carousel-container');  
const circle = document.getElementById('rotating-circle');  
 
const pageLinks = [  
" https://sites.google.com/view/straybaseball-team/%E6%88%90%E5%93%A1",  
" https://sites.google.com/view/straybaseball-team/%E6%9C%80%E6%96%B0%E6%B6%88%E6%81%AF ",  
" https://sites.google.com/view/straybaseball-team/%E6%AF%94%E8%B3%BD%E6%88%B0%E7%B8%BE ",  
" https://sites.google.com/view/straybaseball-team/%E9%97%9C%E6%96%BC%E6%88%91%E5%80%91"  
];  
 
let rotationDegree = 0;  
let currentStep = 0;  
let autoTimer = null;  
 
function updateCarousel() {  
// 1. 動態計算累積公轉角度  
circle.style.transform = `rotate(${rotationDegree}deg)`;  
 
// 2. 切換最外層容器的背景狀態 Class 名稱  
container.className = `carousel-container state-${currentStep + 1}`;  
 
// 3. 控制小按鈕的 Active 高亮狀態與自轉角度抵消  
const icons = document.querySelectorAll('.icon');  
icons.forEach((icon, index) => {  
let translateStr = "";  
if (icon.classList.contains('icon-1')) translateStr = "translate(-50%, -50%)";  
if (icon.classList.contains('icon-2')) translateStr = "translate(50%, -50%)";  
if (icon.classList.contains('icon-3')) translateStr = "translate(-50%, 50%)";  
if (icon.classList.contains('icon-4')) translateStr = "translate(-50%, -50%)";  
 
if (index === currentStep) {  
icon.classList.add('active');  
icon.style.transform = `${translateStr}`;  
} else {  
icon.classList.remove('active');  
icon.style.transform = `${translateStr}`;  
}  
 
// 正負角度抵消：大圓盤轉幾度，內容物就反向轉幾度，確保圖案永遠正立不翻轉  
const innerContent = icon.querySelector('.icon-content');  
 
 
 
if (innerContent) {  
 
innerContent.style.transform = `rotate(${-rotationDegree}deg)`;  
 
}  
 
 
});  
}  
 
// 手動點擊切換邏輯  

function clickToNavigate(targetStep, event) {
  if (event) event.preventDefault();
  let move = targetStep - currentStep;
  
  // 防止逆時鐘
  if (move < 0) {
    move += 4;
  }

  rotationDegree += move * 90;
  currentStep = targetStep;

  // ✨【核心修改】直接同步開啟新分頁，避開手機瀏覽器的攔截機制
  const targetUrl = pageLinks[targetStep].trim();
  window.open(targetUrl, "_blank");

  // 更新輪播與定時器（動畫會在當前頁面背景同步完成）
  updateCarousel();
  clearInterval(autoTimer);
  startAutoPlay();
}

 
// 自動播放定時器（每 4 秒輪播一次）  
function startAutoPlay() {  
autoTimer = setInterval(() => {  
currentStep = (currentStep + 1) % 4;  
 
rotationDegree += 90;  
 
updateCarousel();  
}, 4000);  
}  
 
// 啟動初始化  
updateCarousel();  
startAutoPlay();  
</script>
