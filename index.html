<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAY</title>
    <style>
        /* 基礎全螢幕滿版設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: sans-serif;
            background-color: #000000;
        }

        /* 封面段落區塊 */
        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 影片容器定位 */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 確保影片完美全螢幕滿版 (16:9 縮放公式) */
        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }

        /* 深色半透明遮罩 */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        /* 封面文字內容 */
        .cover-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }

        .cover-content h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        .cover-content p {
            font-size: 1.5rem;
            margin-bottom: 35px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }

        /* 按鈕樣式 */
        .cover-btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        /* 第二段落預留樣式 */
        .other-section {
            padding: 80px 20px;
            text-align: center;
            background: #f9f9f9;
            min-height: 50vh;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 第一段落：封面區塊（已內建跳舞影片範例） -->
    <!-- ========================================== -->
    <section id="part1" class="cover-section">
        
        <!-- 影片將由下方的 JavaScript 自動產生放入，絕對不會被系統吃字 -->
        <div id="videoPlayer" class="video-background"></div>

        <!-- 黑色半透明遮罩 -->
        <div class="video-overlay"></div>

        <!-- 封面中央內容 -->
        <div class="cover-content">
            <h1>STRAY</h1>
            <p>精彩的生活，從這裡開始探索</p>
            <a href="#part2" class="cover-btn">往下看更多</a>
        </div>

    </section>

    <!-- ========================================== -->
    <!-- 第二段落：預留區塊 -->
    <!-- ========================================== -->
    <section id="part2" class="other-section">
        <h2>第二段落預留位置</h2>
        <p>在這裡貼上你第二個 HTML 的內容...</p>
    </section>


    <!-- ========================================== -->
    <!-- 核心控制腳本：自動動態生成滿版背景影片 -->
    <!-- ========================================== -->
    <script>
        (function() {
            // ========================================================
            // ⭐⭐⭐【未來如果要改影片，只需要修改下面這一行】⭐⭐⭐
            // 把雙引號裡面的 dQw4w9WgXcQ 刪掉，換成你自己的 11 位數影片 ID
            // ========================================================
            var myCustomVideoID = "dQw4w9WgXcQ"; 
            
            // 下面的公式會自動幫你拼裝出全螢幕、自動播放、靜音、循環的背景
            var videoContainer = document.getElementById("videoPlayer");
            var targetUrl = "https://youtube.com" + myCustomVideoID + 
                            "?autoplay=1&mute=1&loop=1&playlist=" + myCustomVideoID + 
                            "&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1";
            
            var newIframe = document.createElement("iframe");
            newIframe.src = targetUrl;
            newIframe.frameBorder = "0";
            newIframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
            newIframe.setAttribute("allowfullscreen", "true");
            
            videoContainer.appendChild(newIframe);
        })();
    </script>

</body>
</html>
