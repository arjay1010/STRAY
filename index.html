<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAY-HOME</title>
        <!-- 📌 插入這行來更改網站名稱旁的小圖示 -->
    <link rel="icon" href="https://i.ibb.co/rCptGSd/STRAYICON.png" type="image/x-icon">

    <style>
                        /* --- 全域重設（🏆穩健滿版底圖版：徹底拔除移動功能，保證背景永不丟失） --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            overflow: hidden; /* 防止產生不必要的滾動條 */

            /* 🏆 核心設定：直接在這裡將您的球場圖片鋪滿全螢幕背景 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.3)), 
                              url('https://i.ibb.co/gFmFm1Qv/STRAY-1.png');

            /* 讓背景圖完美自適應、絕不變形、絕不露出黑邊 */
            background-size: 120% auto; /* 寬度放大到 120%，高度自適應。數字越小圖片越小 */
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000; /* 圖片載入前的備用黑底 */
        }




        /* --- 🏆 核心獨立容器：讓整個球場在視窗中百分之百絕對居中 --- */
        .baseball-standalone-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 40px;
        }

        /* 鎖定球場最外圍容器尺寸，支援動態等比例自適應縮放 */
        .field-wrapper {
            position: relative;
            width: 75vmin;  
            height: 75vmin;
            max-width: 550px;
            max-height: 550px;
        }

        /* 繪製完美金黃色實線內野 */
        .diamond-lines {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border: 1.5px solid rgba(212, 175, 55, 0.7); 
            transform: rotate(45deg);
            z-index: 1;
        }

        /* 投手丘中央圈圈定位 */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 🏆 壘包按鈕：維持標準正方形，並利用 rotate(45deg) 轉成完美菱形 */
        .base-card {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: #fff;
        }

        /* 🏆 內容包裹容器：用來把圖片和文字轉回來 (-45deg)，強制水平垂直絕對置中 */
        .base-content-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg); /* 反向旋轉，字才不會跟著歪斜 */
            width: 100%;
            height: 100%;
        }

        /* 限定圖標的最大寬高，絕不允許集體爆開破圖 */
        .base-content-inner img {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            object-fit: contain;
            display: block;
        }

        .base-content-inner span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
            white-space: nowrap;
            text-align: center;
            display: block;
            width: 100%;
        }

        /* 🏆 四個壘包在球場邊角的精密定位與基礎 45 度旋轉（完美融入動畫與排版） */
        .base-2nd { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                       
        .base-2nd:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }

        .base-3rd { top: 50%; left: 0; transform: translateY(-50%) rotate(45deg); }                       
        .base-3rd:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }

        .base-1st { top: 50%; right: 0; transform: translateY(-50%) rotate(45deg); }                      
        .base-1st:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }

        .base-home { bottom: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                  
        .base-home:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }

        /* 當滑鼠懸停在任一按鈕上時，中央圓圈的共振發光特效 */
        .base-card:hover ~ .center-circle {
            box-shadow: 0 0 25px #d4af37;
            transform: translate(-50%, -50%) scale(1.2);
        }
                /* 🏆 終極修正版：利用雙層五角形疊加，強行逼出全閉合金色邊框 */
        .base-home {
            position: absolute;
            bottom: -44px !important; 
            left: 50%;
            transform: translateX(-50%) rotate(0deg) !important;
            width: 88px;
            height: 88px;

            /* ✨ 關鍵修改一：移除原本正方形的 border 設定，改由背景和剪裁來做出金色底層 */
            border: none !important;
            background: #d4af37 !important; /* 這個底色會變成未來的金色邊框 */
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        /* ✨ 關鍵修改二：利用偽元素在上方疊加一個小 2 像素的黑色五角形，藉此露出周圍的金色邊框 */
        .base-home::after {
            content: '';
            position: absolute;
            /* 🏆 四周精準往內縮小 2 像素（這就是邊框的粗細） */
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #111; /* 內部按鈕的黑底色 */
            /* 保持一模一樣的五角形剪裁比例 */
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%);
            z-index: 1;
            transition: background 0.3s ease;
        }

        /* 當滑鼠懸停在本壘上時，背景變亮 */
        .base-home:hover::after {
            background: #222;
        }

        /* 修正懸停時的縮放與發光特效，確保下方的尖角也能同步散發金色微光 */
        .base-home:hover {
            transform: translateX(-50%) rotate(0deg) scale(1.1) !important;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8)); /* 利用智慧濾鏡，強迫五角形全身發光 */
        }

        /* 🏆 關鍵修正：內容容器必須浮在最表層 (z-index: 2)，才不會被黑色遮罩蓋住 */
        .base-home .base-content-inner {
            position: relative;
            z-index: 2;
            transform: rotate(0deg) !important;
            padding-bottom: 12px; /* 微調內部間距，讓圖標與文字完美居中 */
            width: 100%;
            height: 100%;
        }
        /* 🏆 視覺大升級：將線條調暗加深、壘包全面化為極度俐落的鋼硬直角 */

        /* 1. 內野實線：降低亮度、加入黑色戰術深邃陰影 */
        .diamond-lines {
            border: 1px solid rgba(212, 175, 55, 0.45) !important; /* ✨ 調低鮮豔度，改為質感暗金 */
            /* 加上黑色的戰術線條陰影，讓實線看起來是沉在球場地面上的 */
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.9)); 
        }

        /* 2. 一到三壘按鈕外框：徹底拔除圓角 (改成 0px)，變回極度俐落的刀鋒直角 */
        .base-card {
            border-radius: 0px !important; /* ✨ 拔除圓角，回歸最俐落的鋼硬直角 */
            border: 2px solid rgba(212, 175, 55, 0.6) !important; /* 邊框也同步調暗質感 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8); /* 加上硬派底座陰影 */
        }

        /* 懸停發光同步收斂：不要大面積刺眼，改為俐落的聚焦發光 */
        .base-card:hover::before, .base-card:hover {
            border-radius: 0px !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6) !important;
        }

        /* 3. 本壘按鈕：徹底拔除圓角、修剪出完全筆直俐落的五角形邊框 */
        .base-home {
            border-radius: 0px !important;
            background: rgba(212, 175, 55, 0.6) !important; /* 調暗本壘底層金屬色 */
            /* 重新精算裁剪座標：移除任何弧度，強迫尖角處呈現絕對的幾何直角 */
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%) !important;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9)); /* 換成純黑深邃陰影，拿掉原本的刺眼發光 */
        }

        /* 本壘內層：同步拔除圓角、往內縮小 1.5 像素，確保金色細框粗細完美對齊一到三壘 */
        .base-home::after {
            border-radius: 0px !important;
            top: 1.5px !important;
            left: 1.5px !important;
            right: 1.5px !important;
            bottom: 1.5px !important;
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%) !important;
        }

        /* 本壘懸停：收斂亮度 */
        .base-home:hover {
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.5)) !important;
        }
        /* 📱 專屬手機版 RWD 終極優化：縮小壘包釋放間距、完整還原背景圖 */
        @media (max-width: 768px) {

            /* 1. 🏆 核心修改：將手機版背景徹底獨立，換成一張跟電腦版完全不同的新照片 */
            body, html {
                /* 
                   ✨ 關鍵修改點：
                   linear-gradient(rgba(0,0,0,0.4)...) 同步保留 40% 暗色濾鏡，維持精緻質感。
                   url('...') 的括號內，請直接填入您想在手機上顯示的「全新照片名稱或網址」！
                */
                background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                                  url('https://i.ibb.co/yn3WbFCT/STRAY.png') !important; 
                
                /* 根據您的喜好，手機版可以設定 140% 縮放、靠底對齊，確保新照片完美展現 */
                background-size: 100% auto !important; 
                background-position: center bottom !important; 
                background-repeat: no-repeat !important;
                background-color: #000; 
            }



            /* 2. 🏆 核心修改：將球場最外圍容器縮小一點，留出四周的透視空間 */
            .field-wrapper {
                width: 80vw !important;  
                height: 80vw !important;
            }

            /* 3. 🏆 核心修改：縮小一到三壘按鈕，使其從 85px 降到 65px */
            .base-card {
                width: 45px !important;
                height: 45px !important;
            }

            /* 同步微調一到三壘內部圖標與字體大小，確保完美置中 */
            .base-content-inner img {
                width: 20px !important;
                height: 20px !important;
                margin-bottom: 1.2px !important;
            }
            .base-content-inner span {
                font-size: 0.5rem !important;
            }

            /* 4. 🏆 核心修改：同步將本壘五角形縮小到 68px，並修正溢出定位 */
            .base-home {
                bottom: -34px !important; /* 配合 68px 高度，剛好下移一半 */
                width: 60px !important;
                height: 60px !important;
            }

            /* 修正手機版本壘內部黑色遮罩的對齊縮小比例 */
            .base-home::after {
                top: 1.5px !important;
                left: 1.5px !important;
                right: 1.5px !important;
                bottom: 1.5px !important;
            }

            /* 微調本壘內部的間距 */
            .base-home .base-content-inner {
                padding-bottom: 8px !important;
            }

            /* 5. 🏆 核心修改：同步縮小投手丘中央圈圈，使其比例完美對齊 */
            .center-circle {
                width: 35px !important;
                height: 35px !important;
            }
        }
        /* 🏆 專屬樣式：全黑質感前置載入動畫層 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 全黑高級感底色 */
            z-index: 9999; /* 🏆 核心設定：確保它鎖在全網頁的最最上層，蓋住所有壘包 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /* 離開時的滑動與淡出特效 */
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
        }

        /* LOGO 圖片的控制外觀 */
        .loading-logo {
            width: 120px; /* 載入畫面的 LOGO 大小，可自由微調 */
            height: auto;
            object-fit: contain;
            /* 自帶細緻的金色微光充能呼吸燈特效 */
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
            animation: logo-pulse 2s infinite ease-in-out;
        }

        /* 數字百分比的金色硬派字體 */
        .loading-counter {
            font-family: "Impact", "Helvetica Neue", Arial, sans-serif;
            color: #d4af37; /* 延續您的黑金調性 */
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* 當載入完成後，觸發此類別讓畫面向上流暢滑開並隱藏 */
        .loading-screen.fade-out-launcher {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none; /* 解鎖觸控，讓使用者可以點擊後方的壘包 */
        }

        /* LOGO 呼吸燈動畫效果 */
        @keyframes logo-pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.7)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); }
        }

        /* 📱 手機版微調：數字跟 LOGO 稍微縮小，看起來更精緻 */
        @media (max-width: 768px) {
            .loading-logo { width: 90px; }
            .loading-counter { font-size: 1.8rem; }
        }

    </style>
</head>
<body>

    <!-- 🏆 關鍵核心修改：在網頁最頂層插入這個載入動畫結構 -->
    <div class="loading-screen" id="loader-screen">
        <!-- 📌 src 裡請更換為您要放的 LOGO 圖片網址或放在 GitHub 上的檔名（如 logo.png） -->
        <img src="https://i.ibb.co/rCptGSd/STRAYICON.png" class="loading-logo" alt="LOGO">
        <!-- 跑動的數字百分比數字 -->
        <div class="loading-counter" id="loader-counter">0%</div>
    </div>

    <!-- 獨立版球場主區塊 -->
    <div class="baseball-standalone-container">
        <div class="field-wrapper">

            <!-- 金黃色細線內野 -->
            <div class="diamond-lines"></div>

            <!-- 二壘：Instagram -->
            <a href="https://www.instagram.com/stray.official.baseball/" target="_blank" class="base-card base-2nd">
                <div class="base-content-inner">
                    <img src="https://i.ibb.co/0j5RpbFs/500px-Instagram-icon.webp" alt="IG">
                    <span>IG</span>
                </div>
            </a>

            <!-- 三壘：YouTube -->
            <a href="https://www.youtube.com/channel/UCPKMd6qnsWnA0CFn2rYVQtw" class="base-card base-3rd">
                <div class="base-content-inner">
                    <img src="https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp" alt="YT">
                    <span>YT</span>
                </div>
            </a>

            <!-- 一壘：Facebook -->
            <a href="https://www.facebook.com/groups/1057300540985213/posts/26518693757752541/" target="_blank" class="base-card base-1st">
                <div class="base-content-inner">
                    <img src="https://i.ibb.co/W4K1DWsJ/500px-2023-Facebook-icon-svg.webp" alt="FB">
                    <span>FB</span>
                </div>
            </a>

            <!-- 本壘：回首頁 -->
            <a href="https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81-home?authuser=0" target="_self" class="base-card base-home">
                <div class="base-content-inner">
                    <img src="https://i.ibb.co/rCptGSd/STRAYICON.png" alt="首頁">
                    <span>首頁</span>
                </div>
            </a>
            <!-- 中央圈圈：投手丘 -->
            <div class="center-circle"></div>

        </div>
    </div>

    <!-- 🏆 智慧型數字跑動與進場解鎖控制腳本 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const counterElement = document.getElementById("loader-counter");
            const loaderScreen = document.getElementById("loader-screen");

            let currentPercent = 0;

            // 🏆 核心定時器：控制數字增加的速度
            // 每 20 毫秒跑一次，整個計時動畫大約會在 1.5 到 2 秒內帥氣跑完
            const progressInterval = setInterval(() => {
                // 每次隨機增加 1~4%，讓數字跳動看起來有高科技加載的智慧動態感
                currentPercent += Math.floor(Math.random() * 3) + 1;

                // 確保數值絕對不會超越 100%
                if (currentPercent >= 100) {
                    currentPercent = 100;
                    clearInterval(progressInterval); // 數到 100% 後立刻鎖定、停止定時器

                    // 延續質感：抵達 100% 後稍微短暫停留 250 毫秒，接著觸發帥氣的滑開動畫
                    setTimeout(() => {
                        loaderScreen.classList.add("fade-out-launcher");
                    }, 250);
                }

                // 即時將更新後的數字渲染印到畫面上
                counterElement.textContent = currentPercent + "%";
            }, 20);
        });
    </script>
</body>
</html>
