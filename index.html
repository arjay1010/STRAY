<style>  
 
* { box-sizing: border-box; }  
 
body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; font-family: sans-serif; background-color: #11141a; }  
 
 
 
.carousel-container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }  
 
 
 
/* 背景層基礎設定 */  
 
.bg-layer {  
 
position: absolute;  
 
top: 0;  
 
left: 0;  
 
width: 100%;  
 
height: 100%;  
 
z-index: 1;  
 
background-size: cover;  
 
background-position: center;  
 
background-repeat: no-repeat;  
 
opacity: 0;  
 
transition: opacity 1.2s ease-in-out;  
 
will-change: opacity;  
 
}  
 
 
 
/* 🚀 【精確核對】直接寫入您提供的 4 張 ImgBB 大背景圖原始網址 */

/* 純 CSS 狀態連動控制透明度 */

.carousel-container.state-2 .layer-2 { opacity: 1; }  
.carousel-container.state-3 .layer-3 { opacity: 1; }  
.carousel-container.state-4 .layer-4 { opacity: 1; }  
 
/* 黑色半透明保護遮罩 */  
.bg-overlay {  
position: absolute;  
top: 0; left: 0; width: 100%; height: 100%;  
background: rgba(0, 0, 0, 0.5);  
z-index: 2;  
pointer-events: none;  
}  
 
/* 核心 RWD 比例控制盒 */  
.responsive-box {  
position: relative;  
z-index: 3;  
width: 320px;  
height: 320px;  
display: flex;  
justify-content: center;  
align-items: center;  
}  
 
.circle-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }  
 
/* 中央大圖 */  
.center-logo { z-index: 4; pointer-events: none; width: 50%; height: 50%; display: flex; justify-content: center; align-items: center; }

/* 圓軸外框線 */

/* 4 個按鈕圖示尺寸樣式 */  
.icon { position: absolute; width: 50px; height: 50px; background: rgba(17, 20, 26, 0.95); border: 1.5px solid #d4af37; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; text-decoration: none; overflow: hidden; opacity: 0.6; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: background-color 0.5s, border-color 0.5s, opacity 0.5s, box-shadow 0.5s, transform 1.1s; }  
.icon:hover { opacity: 1; border-color: #ffffff; }  
.icon.active { opacity: 1; background-color: #d4af37; border-color: #ffffff; scale: 1; box-shadow: 0 0 15px #d4af37; }  
 
/* 反向旋轉修正容器：抵消轉盤角度，維持小圖示與縮圖正立 */  
.icon-content {  
display: flex;  
justify-content: center;  
align-items: center;  
width: 100%;  
height: 100%;  
transform-origin: center center;  
color: #d4af37;

transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;

/* 小圖示內縮圖通用樣式（完美剪裁貼齊正圓） */

/* 精準平移置中定位 */  
.icon-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }  
.icon-2 { top: 50%; right: 0; transform: translate(50%, -50%); }  
.icon-3 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }  
.icon-4 { top: 50%; left: 0; transform: translate(-50%, -50%); }  
 
/* 💻 平板中螢幕縮放斷點 */
@media (max-width: 1024px) {

}

<script>  
const container = document.getElementById('carousel-container');  
const circle = document.getElementById('rotating-circle');  
 
const pageLinks = [  
" https://sites.google.com/view/straybaseball-team/%E6%88%90%E5%93%A1",  
" https://sites.google.com/view/straybaseball-team/%E6%9C%80%E6%96%B0%E6%B6%88%E6%81%AF ",  
" https://sites.google.com/view/straybaseball-team/%E6%AF%94%E8%B3%BD%E6%88%B0%E7%B8%BE ",  
" https://sites.google.com/view/straybaseball-team/%E9%97%9C%E6%96%BC%E6%88%91%E5%80%91"  
];  
 
let rotationDegree = 0;  
let currentStep = 0;  
let autoTimer = null;  
 
function updateCarousel() {  
// 1. 動態計算累積公轉角度  
circle.style.transform = `rotate(${rotationDegree}deg)`;  
 
// 2. 切換最外層容器的背景狀態 Class 名稱  
container.className = `carousel-container state-${currentStep + 1}`;  
 
// 3. 控制小按鈕的 Active 高亮狀態與自轉角度抵消  
const icons = document.querySelectorAll('.icon');  
icons.forEach((icon, index) => {  
let translateStr = "";  
if (icon.classList.contains('icon-1')) translateStr = "translate(-50%, -50%)";  
if (icon.classList.contains('icon-2')) translateStr = "translate(50%, -50%)";  
if (icon.classList.contains('icon-3')) translateStr = "translate(-50%, 50%)";  
if (icon.classList.contains('icon-4')) translateStr = "translate(-50%, -50%)";  
 
if (index === currentStep) {  
icon.classList.add('active');  
icon.style.transform = `${translateStr}`;  
} else {  
icon.classList.remove('active');  
icon.style.transform = `${translateStr}`;  
}  
 
// 正負角度抵消：大圓盤轉幾度，內容物就反向轉幾度，確保圖案永遠正立不翻轉  
const innerContent = icon.querySelector('.icon-content');  
 
 
 
if (innerContent) {  
 
innerContent.style.transform = `rotate(${-rotationDegree}deg)`;  
 
}  
 
 
});  
}  
 
// 手動點擊切換邏輯  

function clickToNavigate(targetStep, event) {
  if (event) event.preventDefault();
  let move = targetStep - currentStep;
  
  // 防止逆時鐘
  if (move < 0) {
    move += 4;
  }

  rotationDegree += move * 90;
  currentStep = targetStep;

  // ✨【核心修改】直接同步開啟新分頁，避開手機瀏覽器的攔截機制
  const targetUrl = pageLinks[targetStep].trim();
  window.open(targetUrl, "_blank");

  // 更新輪播與定時器（動畫會在當前頁面背景同步完成）
  updateCarousel();
  clearInterval(autoTimer);
  startAutoPlay();
}

 
// 自動播放定時器（每 4 秒輪播一次）  
function startAutoPlay() {  
autoTimer = setInterval(() => {  
currentStep = (currentStep + 1) % 4;  
 
rotationDegree += 90;  
 
updateCarousel();  
}, 4000);  
}  
 
// 啟動初始化  
updateCarousel();  
startAutoPlay();  
</script>

                <p><!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: transparent; }
        
        /* 輪播主要外框（固定不動，維持結構穩定） */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 實際會上下浮動的圖片容器 */
        .slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 綁定上下浮動的動畫 */
            animation: floatAnimation 4s ease-in-out infinite; 
        }
        
        /* 當滑鼠移入輪播區域時，暫停浮動動畫，方便觀看與點擊 */
        .slider-wrapper:hover .slider-container {
            animation-play-state: paused;
        }

        /* 定義網頁緩慢上下浮動的特效 (移動 8 像素) */
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        
        /* 圖片設定 */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持圖片比例完整顯示在框內 */
        }
        .slide.active { display: block; }
        
        /* 左右兩側的懸浮切換按鈕 (固定在外框上，不隨圖片晃動以免點不到) */
        .side-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5); /* 半透明黑背景 */
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 4px;
            z-index: 15;
            transition: background 0.3s;
        }
        .side-btn:hover { background: rgba(0, 0, 0, 0.8); }
        .prev { left: 15px; }
        .next { right: 15px; }
        
        /* 下方分頁圓點列 (完全透明背景，置中，固定不動) */
        .pagination-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px; /* 圓點之間的間距 */
            background: transparent;
            z-index: 10;
            user-select: none;
        }
        
        /* 小圓點基本樣式 */
        .page-dot {
            width: 8px; /* 寬度小 */
            height: 8px; /* 高度小 */
            background-color: rgba(255, 255, 255, 0.6); /* 未選中時為半透明白 */
            border-radius: 50%; /* 變成正圓形 */
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.5); /* 輕微陰影防白底隱形 */
        }
        .page-dot:hover {
            background-color: rgba(255, 255, 255, 1);
            transform: scale(1.2); /* 滑鼠滑過稍微放大 */
        }
        
        /* 當前選中圖片的藍色圓點樣式 */
        .page-dot.active {
            background-color: #2196F3; /* 亮藍色 */
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="slider-wrapper">
    <!-- 左右側手動切換箭頭 -->
    <button class="side-btn prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="side-btn next" onclick="changeSlide(1)">&#10095;</button>

    <!-- 會上下浮動的圖片區域 -->
    <div class="slider-container">
        <!-- 圖片區塊：之後要新增圖片，直接在下方複製 <img> 標籤並更改網址即可 -->
    <img class="slide active" src="https://i.ibb.co/qYf6QPzs/2026-9-5.png" alt="1">
    <img class="slide" src="https://i.ibb.co/ZpMks18H/2026-9-13.png" alt="2">
    <img class="slide" src="https://i.ibb.co/7LWH0L0/2026-9-28.png" alt="3">

    </div>

    <!-- 下方中央導覽列（全透明小圓點） -->
    <div class="pagination-container" id="pagination">
        <!-- JavaScript 會根據上面圖片數量，自動在此產生對應數量的圓點 -->
    </div>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const pagination = document.getElementById('pagination');

    // 自動動態產生下方的圓點分頁
    function createPagination() {
        pagination.innerHTML = ''; // 清空內容
        
        slides.forEach((_, index) => {
            const dotBtn = document.createElement('div');
            dotBtn.className = 'page-dot';
            if (index === currentSlide) dotBtn.classList.add('active');
            dotBtn.onclick = () => goToSlide(index);
            pagination.appendChild(dotBtn);
        });
    }

    // 更新圖片顯示與圓點藍色高亮狀態
    function updateSlider() {
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentSlide);
        });
        
        const dots = pagination.querySelectorAll('.page-dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlide);
        });
    }

    // 左右箭頭切換
    function changeSlide(direction) {
        currentSlide = (currentSlide + direction + slides.length) % slides.length;
        updateSlider();
    }

    // 點擊圓點直接跳轉
    function goToSlide(index) {
        currentSlide = index;
        updateSlider();
    }

    // 初始化
    createPagination();
</script>

</body>
