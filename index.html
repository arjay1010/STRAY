<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAY</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: sans-serif;
            background-color: #000000;
        }
        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }
        .cover-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }
        .cover-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }
        .cover-content p {
            font-size: 1.5rem;
            margin-bottom: 35px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }
        .cover-btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .other-section {
            padding: 80px 20px;
            text-align: center;
            background: #f9f9f9;
            min-height: 50vh;
        }
    </style>
</head>
<body>

    <!-- 第一段落：封面 -->
    <section id="part1" class="cover-section">
        
        <div class="video-background">
            <!-- 這裡去除了所有複雜參數，直接放入最乾淨的嵌入連結 -->
            <iframe src="https://youtube.com" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>

        <div class="video-overlay"></div>

        <div class="cover-content">
            <h1>歡迎來到我的網站</h1>
            <p>精彩的生活，從這裡開始探索</p>
            <a href="#part2" class="cover-btn">往下看更多</a>
        </div>

    </section>

    <!-- 第二段落：預留區塊 -->
    <section id="part2" class="other-section">
        <h2>第二段落預留位置</h2>
        <p>在這裡貼上你第二個 HTML 的內容...</p>
    </section>

</body>
</html>
