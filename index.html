<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAY</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: sans-serif;
            background-color: #000000;
        }
        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }
        .cover-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }
        .cover-content h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }
        .cover-content p {
            font-size: 1.5rem;
            margin-bottom: 35px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }
        .cover-btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .other-section {
            padding: 80px 20px;
            text-align: center;
            background: #f9f9f9;
            min-height: 50vh;
        }
    </style>
</head>
<body>

    <!-- 第一段落：封面區塊 -->
    <section id="part1" class="cover-section">
        <div id="videoPlayer" class="video-background"></div>
        <div class="video-overlay"></div>
        <div class="cover-content">
            <h1>STRAY</h1>
            <p>精彩的生活，從這裡開始探索</p>
            <a href="#part2" class="cover-btn">往下看更多</a>
        </div>
    </section>

    <!-- 第二段落：預留區塊 -->
    <section id="part2" class="other-section">
        <h2>第二段落預留位置</h2>
        <p>在這裡貼上你第二個 HTML 的內容...</p>
    </section>

    <!-- 引入 YouTube 官方 API 腳本，用最高權限強制執行靜音與播放 -->
    <script src="https://youtube.com"></script>
    <script>
        // ========================================================
        // ⭐⭐⭐【未來如果要改影片，只需要修改下面這一行】⭐⭐⭐
        // 把雙引號裡面的 dQw4w9WgXcQ 刪掉，換成你自己的 11 位數影片 ID
        // ========================================================
        var myCustomVideoID = "3qV05Bhzek4"; 

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('videoPlayer', {
                videoId: myCustomVideoID,
                playerVars: {
                    'autoplay': 1,        // 開啟自動播放
                    'mute': 1,            // 網址端靜音
                    'controls': 0,        // 隱藏控制列
                    'showinfo': 0,        // 隱藏影片資訊
                    'rel': 0,             // 關閉相關影片推薦
                    'loop': 1,            // 開啟循環播放
                    'playlist': myCustomVideoID, // 循環必備參數
                    'modestbranding': 1,  // 隱藏 YouTube Logo
                    'iv_load_policy': 3   // 隱藏影片註解
                },
                events: {
                    'onReady': function(event) {
                        event.target.mute();          // 🔴 核心破防：當影片準備好，立刻命令硬體「實體靜音」
                        event.target.playVideo();     // 🔴 核心破防：在靜音狀態下，強制瀏覽器啟動播放
                    },
                    'onStateChange': function(event) {
                        // 當影片播完時，強制重頭播放，達成完美無縫循環
                        if (event.data === YT.PlayerState.ENDED) {
                            player.playVideo();
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
