<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高質感金色導覽控制台</title>
    <style>
        /* --- 全域重設 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: #000;
            color: #fff;
            scrollbar-width: none; /* 隱藏滾動條 Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* 隱藏滾動條 Chrome/Safari */
        }

        /* --- 右側金色圈圈導覽列 --- */
        .dot-navigation {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: flex-end;
        }
        .dot-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            position: relative;
        }
        .dot-label {
            color: #d4af37;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.4s ease;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }
        .dot-circle {
            width: 12px;
            height: 12px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: transparent;
            transition: all 0.4s ease;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }
        .dot-item.active .dot-circle,
        .dot-item:hover .dot-circle {
            background: #d4af37;
            transform: scale(1.3);
            box-shadow: 0 0 15px #d4af37, 0 0 25px rgba(212, 175, 55, 0.6);
        }
        .dot-item.active .dot-label,
        .dot-item:hover .dot-label {
            opacity: 1;
            transform: translateX(0);
        }

        /* --- 網頁段落區塊 --- */
        .page-section {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* --- 頁一：最新消息圖片輪播 --- */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            text-decoration: none;
        }
        .carousel-slide.active {
            opacity: 1;
        }
        
        .carousel-caption {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .carousel-controls-bottom {
            display: flex;
            gap: 20px;
        }
        .carousel-arrow {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid #d4af37;
            font-size: 1.5rem;
            padding: 8px 20px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 4px;
        }
        .carousel-arrow:hover { 
            background: #d4af37; 
            color: #000; 
            box-shadow: 0 0 10px #d4af37;
        }

        /* --- 頁二：壘包功能區塊樣式（🏆終極幾何修正版：完美菱形與絕對置中） --- */
        .baseball-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 40px;
            position: relative;
        }
        .field-wrapper {
            position: relative;
            width: 75vmin;  
            height: 75vmin;
            max-width: 550px;
            max-height: 550px;
        }
        .diamond-lines {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border: 2px solid rgba(212, 175, 55, 0.8); 
            transform: rotate(45deg);
            z-index: 1;
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .base-card {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: #fff;
        }
        .base-content-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg);
            width: 100%;
            height: 100%;
        }
        .base-content-inner img {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            object-fit: contain;
            display: block;
        }
        .base-content-inner span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
            white-space: nowrap;
            text-align: center;
            display: block;
            width: 100%;
        }
        .base-2nd { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                       
        .base-2nd:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-3rd { top: 50%; left: 0; transform: translateY(-50%) rotate(45deg); }                       
        .base-3rd:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-1st { top: 50%; right: 0; transform: translateY(-50%) rotate(45deg); }                      
        .base-1st:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-home { bottom: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                  
        .base-home:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        .base-card:hover ~ .center-circle {
            box-shadow: 0 0 25px #d4af37;
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body>

    <!-- 右側替代滾動條：金色精緻圈圈導覽選單 -->
    <div class="dot-navigation">
        <div class="dot-item active" data-target="page1">
            <span class="dot-label">📢 最新消息</span>
            <div class="dot-circle"></div>
        </div>
        <div class="dot-item" data-target="page2">
            <span class="dot-label">⚾ 壘包主控台</span>
            <div class="dot-circle"></div>
        </div>
    </div>

    <!-- 頁一：全螢幕輪播圖區塊 -->
    <section id="page1" class="page-section">
        <div class="carousel-container">
            <a href="這裡改成第一張圖要跳轉的網頁.html" target="_self" class="carousel-slide active" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://picsum.photos');"></a>
            <a href="這裡改成第二張圖要跳轉的網頁.html" target="_self" class="carousel-slide" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://picsum.photos');"></a>
            <a href="這裡改成第三張圖要跳轉的網頁.html" target="_self" class="carousel-slide" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://picsum.photos');"></a>

            <div class="carousel-caption">
                <div class="carousel-controls-bottom">
                    <button class="carousel-arrow arrow-left" onclick="changeSlide(-1)">&#10094;</button>
                    <button class="carousel-arrow arrow-right" onclick="changeSlide(1)">&#10095;</button>
                </div>
            </div>
        </div>
    </section>
    <!-- 頁二：響應式壘包功能區塊 -->
    <section id="page2" class="page-section">
        <div class="baseball-container">
            <div class="field-wrapper">
                <div class="diamond-lines"></div>

                <!-- 二壘：Instagram -->
                <a href="https://www.instagram.com/stray.official.baseball/" target="_blank" class="base-card base-2nd">
                    <div class="base-content-inner">
                        <img src="https://i.ibb.co/0j5RpbFs/500px-Instagram-icon.webp" alt="IG">
                        <span>IG</span>
                    </div>
                </a>

                <!-- 三壘：YouTube -->
                <a href="https://www.youtube.com/channel/UCPKMd6qnsWnA0CFn2rYVQtw" target="_blank" class="base-card base-3rd">
                    <div class="base-content-inner">
                        <img src="https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp" alt="YT">
                         <span>YT</span> 
                    </div>
                </a>

                <!-- 一壘：Facebook -->
                <a href="https://www.facebook.com/groups/1057300540985213/posts/26518693757752541/" target="_blank" class="base-card base-1st">
                    <div class="base-content-inner">
                        <img src="https://i.ibb.co/W4K1DWsJ/500px-2023-Facebook-icon-svg.webp" alt="FB">
                        <span>FB</span>
                    </div>
                </a>

                <!-- 本壘：首頁 -->
                <a href="https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81-home?authuser=0"_self" class="base-card base-home" id="home-base-btn">
                    <div class="base-content-inner">
                        <img src="https://i.ibb.co/rCptGSd/STRAYICON.png" alt="首頁">
                        <span>首頁</span>
                    </div>
                </a>

                <div class="center-circle"></div>
            </div>
        </div>
    </section>

    <script>
        /* --- 1. 右側圈圈點擊：平滑滾動到該頁面 --- */
        const dotItems = document.querySelectorAll('.dot-item');
        dotItems.forEach(item => {
            item.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const targetSection = document.getElementById(targetId);
                targetSection.scrollIntoView({ behavior: 'smooth' });
            });
        });

        /* --- 本壘按鈕：自動平滑滾動回第一頁 --- */
        document.getElementById('home-base-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('page1').scrollIntoView({ behavior: 'smooth' });
        });

        /* --- 2. 智慧滾輪監聽：滾動時自動高亮對應的金色圈圈 --- */
        const sections = document.querySelectorAll('.page-section');
        window.addEventListener('scroll', () => {
            let currentActiveSectionId = "";
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.pageYOffset >= sectionTop - window.innerHeight / 2) {
                    currentActiveSectionId = section.getAttribute('id');
                }
            });
            dotItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-target') === currentActiveSectionId) {
                    item.classList.add('active');
                }
            });
        });

        /* --- 3. 全螢幕最新消息自動輪播邏輯 --- */
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }
        setInterval(() => { changeSlide(1); }, 5000);
    </script>
</body>
</html>
